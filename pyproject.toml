[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "terminal-pet"
version = "1.0.0"
description = "Милый ASCII-зверёк, который живёт в терминале и помнит тебя между запусками"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "OpenHands", email = "openhands@all-hands.dev" }]
keywords = ["ascii", "pet", "terminal", "fun", "companion"]

[project.scripts]
terminal-pet = "terminal_pet.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["terminal_pet*"]